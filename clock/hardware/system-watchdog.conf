[Manager]
# Allwinner sunxi-wdt supports a maximum hardware timeout of 16 seconds.
# systemd services the watchdog during normal runtime; if PID 1 or the kernel
# stalls long enough to miss servicing it, the board resets itself.
RuntimeWatchdogSec=16s
# Use the same hardware-supported timeout while rebooting/shutting down.
RebootWatchdogSec=16s
