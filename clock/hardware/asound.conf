# bpi-zero-clock native hardware routing
# The asym plugin selects direction-specific hardware PCMs only.
# No plug/rate-conversion PCM is present.

pcm.mkclock_playback {
    type hw
    card MAX98357A
    device 0
}

pcm.mkclock_capture {
    type hw
    card MAX98357A
    device 1
}

pcm.!default {
    type asym
    playback.pcm "mkclock_playback"
    capture.pcm "mkclock_capture"
}

ctl.!default {
    type hw
    card MAX98357A
}
